name: Swarm Launch Regression

on:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/swarm_launch.sh'
      - 'scripts/lib/swarm_plan.sh'
      - 'scripts/lib/swarm_packet.sh'
      - 'scripts/lib/doctor.sh'
      - 'scripts/lib/update.sh'
      - 'install.sh'
      - 'scripts/check-manifest-drift.sh'
      - 'packages/manifest/src/generate.test.ts'
      - 'packages/manifest/src/generate.ts'
      - 'scripts/generated/internal_checksums.sh'
      - 'tests/unit/test_swarm_launch.py'
      - 'tests/unit/test_swarm_launch_handoff.py'
      - 'tests/unit/test_swarm_packet_preparation.py'
      - '.github/workflows/swarm-launch-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Check canonical generated runtime membership
        working-directory: packages/manifest
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun run generate:diff
          bun test src/generate.test.ts
      - name: Check launcher and packet handoff regressions
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n scripts/check-manifest-drift.sh
          bash -n scripts/lib/swarm_launch.sh
          bash -n scripts/lib/doctor.sh
          bash -n scripts/lib/update.sh
          shellcheck scripts/lib/swarm_launch.sh
          python3 -B tests/unit/test_swarm_launch.py -v
          python3 -B tests/unit/test_swarm_packet_preparation.py -v
          python3 -B tests/unit/test_swarm_launch_handoff.py -v
          TARGET_USER="$(id -un)" bash scripts/lib/doctor.sh swarm launch --help > /tmp/acfs-launch-help
          grep -F -- '--expect-sha256' /tmp/acfs-launch-help
          grep -F -- '--launch' /tmp/acfs-launch-help
          TARGET_USER="$(id -un)" bash scripts/lib/doctor.sh swarm launch --prepare-batch --help | grep -F -- '--identity'
          TARGET_USER="$(id -un)" bash scripts/lib/doctor.sh swarm launch --dispatch-batch --help | grep -F -- '--send'
          TARGET_USER="$(id -un)" bash scripts/lib/doctor.sh swarm help | grep -F 'plan|launch|status'
      - name: Verify the fresh-install launch asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          lines = Path('install.sh').read_text().splitlines()
          copies = [line for line in lines if line.strip().startswith('try_step "Installing swarm_launch.sh" install_asset ')]
          assert len(copies) == 1
          with tempfile.TemporaryDirectory(prefix='acfs-launch-install-') as home:
              script = 'set -euo pipefail\nACFS_HOME="$1"\nmkdir -p "$ACFS_HOME/scripts/lib"\n'
              script += 'try_step() { shift; "$@"; }\ninstall_asset() { cp -- "$1" "$2"; }\n'
              script += copies[0] + '\n'
              script += 'bash "$ACFS_HOME/scripts/lib/swarm_launch.sh" --help\n'
              subprocess.run(['bash', '-c', script, 'installation-smoke', home], check=True)
              assert (Path(home) / 'scripts/lib/swarm_launch.sh').read_bytes() == Path('scripts/lib/swarm_launch.sh').read_bytes()
          PY
