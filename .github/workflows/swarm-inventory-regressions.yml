name: Swarm Inventory Regression

on:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/swarm_inventory.sh'
      - 'tests/unit/test_swarm_inventory*'
      - '.github/workflows/swarm-inventory-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-inventory-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check runtime and shell regression syntax
        run: |
          set -euo pipefail
          bash -n scripts/lib/swarm_inventory.sh tests/unit/test_swarm_inventory.sh
          shellcheck scripts/lib/swarm_inventory.sh tests/unit/test_swarm_inventory.sh
      - name: Exercise fleet admission and placement without skips
        run: |
          python3 -B - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/unit', pattern='test_swarm_inventory_*.py')
          expected = suite.countTestCases()
          if expected < 37:
              raise SystemExit('Expected at least the 37 fleet admission and placement regressions')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun == expected else 1)
          PY
      - name: Run existing inventory integration regressions
        run: bash tests/unit/test_swarm_inventory.sh
