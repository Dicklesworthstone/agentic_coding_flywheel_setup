name: Swarm Inventory Regression

on:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/swarm_inventory.sh'
      - 'scripts/lib/capacity.sh'
      - 'tests/unit/test_capacity*'
      - 'tests/unit/test_swarm_inventory*'
      - '.github/workflows/swarm-inventory-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-inventory-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check runtime and shell regression syntax
        run: |
          set -euo pipefail
          bash -n scripts/lib/capacity.sh
          bash -n scripts/lib/swarm_inventory.sh
          bash -n tests/unit/test_swarm_inventory.sh
          shellcheck scripts/lib/capacity.sh scripts/lib/swarm_inventory.sh tests/unit/test_swarm_inventory.sh
      - name: Exercise process resource limits without skips
        run: |
          python3 -B - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover('tests/unit', pattern='test_capacity_limits.py')
          expected = suite.countTestCases()
          if expected < 37:
              raise SystemExit('Expected at least 37 process-limit and capacity-model regressions')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun == expected else 1)
          PY
          bash tests/unit/test_capacity.sh
      - name: Exercise fleet admission, placement and local probes without skips
        run: |
          python3 -B - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/unit', pattern='test_swarm_inventory_*.py')
          expected = suite.countTestCases()
          if expected < 63:
              raise SystemExit('Expected at least 63 fleet admission, placement and probe regressions')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun == expected else 1)
          PY
      - name: Run existing inventory integration regressions
        run: bash tests/unit/test_swarm_inventory.sh
      - name: Measure real kernel limits and an explicitly constrained child
        run: |
          set -euo pipefail
          python3 -B tests/unit/test_capacity_limits.py --live
          sudo systemd-run --quiet --wait --pipe --collect --unit="acfs-capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -p MemoryMax=512M -p CPUQuota=50% /usr/bin/env ACFS_LIMIT_TEST_RESTRICTED=1 /usr/bin/python3 -B "$PWD/tests/unit/test_capacity_limits.py" --live
      - name: Measure the real local runner and verify CLI integration
        run: |
          set -euo pipefail
          python3 -B tests/unit/test_swarm_inventory_probe.py --live
          TARGET_USER="$(id -un)" bash scripts/lib/doctor.sh swarm inventory probe-local --help > /tmp/acfs-probe-help
          grep -F -- '--host-id' /tmp/acfs-probe-help
          grep -F -- '--disk-path' /tmp/acfs-probe-help
