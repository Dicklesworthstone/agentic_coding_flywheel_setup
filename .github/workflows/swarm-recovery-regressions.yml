name: Swarm Recovery Regression

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'scripts/lib/swarm_launch_recovery.py'
      - 'scripts/lib/swarm_launch.sh'
      - 'scripts/lib/swarm_packet.sh'
      - 'scripts/lib/doctor.sh'
      - 'scripts/lib/update.sh'
      - 'scripts/check-manifest-drift.sh'
      - 'scripts/generated/**'
      - 'packages/manifest/**'
      - 'acfs.manifest.yaml'
      - 'checksums.yaml'
      - 'bun.lock'
      - 'tests/unit/test_swarm_launch*.py'
      - 'tests/unit/test_swarm_packet_preparation.py'
      - '.github/workflows/swarm-recovery-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-recovery-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install locked generator dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify committed runtime distribution without regeneration
        run: |
          set -euo pipefail
          bun run --cwd packages/manifest generate:diff
          bun run --cwd packages/manifest type-check
          bun test packages/manifest/src/generate.test.ts
          bash scripts/check-manifest-drift.sh --json
          for file in install.sh scripts/lib/update.sh scripts/lib/swarm_launch.sh scripts/check-manifest-drift.sh; do
            bash -n "$file"
          done
          shellcheck install.sh scripts/lib/update.sh scripts/lib/swarm_launch.sh scripts/check-manifest-drift.sh
      - name: Verify recovery, installed routing and scoped handoff without skips
        run: |
          python3 -B - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover('tests/unit', pattern='test_swarm_launch_recovery*.py')
          expected = suite.countTestCases()
          if expected < 50:
              raise SystemExit('Expected at least 50 recovery and installed-handoff regressions')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun == expected else 1)
          PY
      - name: Preserve native launch and packet behavior
        run: |
          set -euo pipefail
          python3 -B tests/unit/test_swarm_launch.py -v
          python3 -B tests/unit/test_swarm_launch_handoff.py -v
          python3 -B tests/unit/test_swarm_packet_preparation.py -v
          TARGET_USER="$(id -un)" bash scripts/lib/doctor.sh swarm launch --recover --help | grep -F -- '--adopt'
          TARGET_USER="$(id -un)" bash scripts/lib/doctor.sh swarm launch --reconcile --help | grep -F -- '--receipt'
