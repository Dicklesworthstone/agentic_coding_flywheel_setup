name: Swarm Fleet Probe Regression

on:
  push:
    branches: [main]
    paths: ['.github/workflows/swarm-fleet-probe-regressions.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-fleet-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet-probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply the exact reviewed installed-fleet candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9e6d76ff224d886c5364e36567d38998e58efc7e
          gh api repos/Dicklesworthstone/agentic_coding_flywheel_setup/git/blobs/cb6ca7438db4dd3b640c9a2189fc95a61eeb6c38 --jq .content | base64 -d > "$RUNNER_TEMP/candidate.patch"
          echo "e2d6953d999a84eb580ebad1b0227b986b3f70bc845226f42e49d1a674fe5d53  $RUNNER_TEMP/candidate.patch" | sha256sum -c -
          git apply --check --index "$RUNNER_TEMP/candidate.patch"
          git apply --index "$RUNNER_TEMP/candidate.patch"
      - name: Install test dependencies without package lifecycle scripts
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          if ! command -v shellcheck || ! command -v jq || ! test -x /usr/sbin/sshd; then
            sudo apt-get update -qq
            sudo apt-get install -y openssh-server shellcheck jq
          fi
      - name: Canonically generate and verify distribution checksums
        run: |
          set -euo pipefail
          bun run --cwd packages/manifest generate
          bun run --cwd packages/manifest generate:diff
          bun run --cwd packages/manifest type-check
          bun test packages/manifest/src/generate.test.ts
          bash scripts/check-manifest-drift.sh --json
      - name: Check runtime syntax and ShellCheck
        run: |
          set -euo pipefail
          for file in install.sh scripts/lib/doctor.sh scripts/lib/update.sh scripts/lib/swarm_inventory.sh scripts/lib/swarm_fleet_probe.sh scripts/check-manifest-drift.sh; do
            bash -n "$file"
          done
          shellcheck install.sh scripts/lib/doctor.sh scripts/lib/update.sh scripts/lib/swarm_inventory.sh scripts/lib/swarm_fleet_probe.sh scripts/check-manifest-drift.sh
      - name: Run collector and installed-command regressions without skips
        run: |
          python3 -B - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover('tests/unit', pattern='test_swarm_fleet_probe.py')
          expected = suite.countTestCases()
          if expected < 40:
              raise SystemExit('Expected at least 40 fleet and installed-command regressions')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun == expected else 1)
          PY
      - name: Verify actual OpenSSH through checkout and installed CLI
        run: python3 -B tests/unit/test_swarm_fleet_probe.py --live-ssh
      - name: Run existing fleet inventory regressions
        run: |
          python3 -B -m unittest discover -s tests/unit -p 'test_swarm_inventory_*.py' -v
          bash tests/unit/test_swarm_inventory.sh
      - name: Preserve verified candidate Git objects without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tarfile, urllib.request
          expected = {
            'docs/operations/swarm-fleet-probe.md':'5aa1b5ecb0bee4174c30c16ece8960bed63d401a',
            'install.sh':'fe8f2441aa51ec24f4a0e80b584c0fabb8cd6511',
            'packages/manifest/src/generate.test.ts':'d3c265c62129fdf0350cb9b9352be2ac4bbd4753',
            'packages/manifest/src/generate.ts':'3e5d1ab0cad20a313728f56e1a748c091377c4e7',
            'scripts/check-manifest-drift.sh':'424995882c3ebfc686a1117b047efe59b374f2b3',
            'scripts/lib/doctor.sh':'be813de12bbd1614428a128fff36edda8de508b3',
            'scripts/lib/swarm_inventory.sh':'1f1681420937eaf4f5bcc978cc8c1da373137e39',
            'scripts/lib/update.sh':'f71bef73ed6f02cc0d480663293d84df01c7f2c3',
            'tests/unit/test_swarm_fleet_probe.py':'f9aac61a4f12ce16ad4b24de9b61b7a060d1077d',
          }
          paths = set(subprocess.check_output(['git','diff','HEAD','--name-only'], text=True).splitlines())
          assert paths == set(expected) | {'scripts/generated/internal_checksums.sh'}, paths
          objects = []
          for path in sorted(paths):
              data = pathlib.Path(path).read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if path in expected:
                  assert sha == expected[path], (path, sha)
              mode = subprocess.check_output(['git','ls-tree','HEAD','--',path], text=True).split()[0]
              request = urllib.request.Request(
                  'https://api.github.com/repos/Dicklesworthstone/agentic_coding_flywheel_setup/git/blobs',
                  data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),
                  headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},
                  method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert json.load(response)['sha'] == sha
              objects.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          result = {'tested_head':os.environ['GITHUB_SHA'],'objects':objects}
          output = pathlib.Path(os.environ['RUNNER_TEMP'])
          (output / 'candidate-objects.json').write_text(json.dumps(result,indent=2) + '\n')
          print(json.dumps(result,indent=2))
          with tarfile.open(output / 'candidate-files.tar.gz','w:gz') as archive:
              for path in sorted(paths):
                  archive.add(path,arcname=path,recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: installed-fleet-candidate-${{ github.sha }}-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/candidate-objects.json
            ${{ runner.temp }}/candidate-files.tar.gz
          if-no-files-found: error
          retention-days: 1
