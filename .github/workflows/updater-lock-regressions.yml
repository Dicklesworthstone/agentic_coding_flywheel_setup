name: Updater Lock Regression

on:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/update.sh'
      - 'scripts/lib/security.sh'
      - 'tests/unit/test_update_lock.py'
      - 'tests/unit/test_update_pin_failures.py'
      - '.github/workflows/updater-lock-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updater-lock-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check complete updater and verifier syntax and ShellCheck
        run: |
          set -euo pipefail
          bash -n scripts/lib/update.sh
          bash -n scripts/lib/security.sh
          shellcheck scripts/lib/update.sh scripts/lib/security.sh
      - name: Exercise real kernel locking, including cross-UID admission
        run: |
          set -euo pipefail
          sudo python3 -B - <<'PY'
          import importlib.util
          import sys
          import unittest
          spec = importlib.util.spec_from_file_location("update_lock_tests", "tests/unit/test_update_lock.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          expected = suite.countTestCases()
          if expected < 27:
              raise SystemExit("Expected at least 27 updater-lock regressions")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun == expected else 1)
          PY
      - name: Exercise installer pin recovery and failure reporting
        run: python3 -B tests/unit/test_update_pin_failures.py
