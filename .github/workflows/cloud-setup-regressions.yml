name: Cloud Setup Regression

on:
  push:
    branches: [main]
    paths:
      - 'scripts/claude-code-web-setup.sh'
      - 'scripts/cloud-mirror-publish.py'
      - 'cloud-mirror.json'
      - 'tests/unit/test_claude_code_web_setup.*'
      - '.github/workflows/cloud-setup-regressions.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/claude-code-web-setup.sh'
      - 'scripts/cloud-mirror-publish.py'
      - 'cloud-mirror.json'
      - 'tests/unit/test_claude_code_web_setup.*'
      - '.github/workflows/cloud-setup-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint setup entrypoint
        run: shellcheck scripts/claude-code-web-setup.sh tests/unit/test_claude_code_web_setup.sh
      - name: Exercise verification, network failures, deadlines and both agents
        run: bash tests/unit/test_claude_code_web_setup.sh

  public-binaries:
    # Manual smoke executes only the trusted default-branch manifest.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install all public prebuilt tools in a fresh home
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/acfs-cloud-smoke"
          mkdir -p "$HOME"
          ACFS_REF="$GITHUB_SHA" ACFS_CLOUD_AGENT=codex ACFS_CLOUD_REINSTALL=1 bash scripts/claude-code-web-setup.sh
          for tool in br bv am mcp-agent-mail ubs cass cm ms ast-grep jsm jfp; do
            timeout --kill-after=1 5 "$HOME/.local/bin/$tool" --version
          done
          test -s "$HOME/.codex/AGENTS.md"
          export PATH="$HOME/.local/bin:$PATH"
          smoke="$HOME/.acfs/cloud"
          printf '%s\n' 'export function sum(a, b) { return a + b; }' > "$smoke/safe.js"
          printf '%s\n' 'export function run(source) { return eval(source); }' > "$smoke/unsafe.js"
          # First scans must use the provisioned tools and bundled helpers.
          # Fail and retain any attempted curl/wget dependency downloads.
          mkdir "$smoke/offline-bin"
          export ACFS_SMOKE_NETWORK_LOG="$smoke/scan-network-attempts.log"
          for downloader in curl wget; do
            cat > "$smoke/offline-bin/$downloader" <<'SH'
          #!/bin/sh
          printf '%s\n' "$0 $*" >> "$ACFS_SMOKE_NETWORK_LOG"
          exit 97
          SH
            chmod 755 "$smoke/offline-bin/$downloader"
          done
          export PATH="$smoke/offline-bin:$PATH"
          timeout --kill-after=2 60 ubs --ci --fail-on-warning --format=json "$smoke/safe.js" > "$smoke/safe-report.json"
          if timeout --kill-after=2 60 ubs --ci --fail-on-warning --format=json "$smoke/unsafe.js" > "$smoke/unsafe-report.json"; then
            echo 'UBS missed the unsafe eval smoke input' >&2
            exit 1
          else
            unsafe_rc=$?
            test "$unsafe_rc" -eq 1
          fi
          python3 - "$smoke" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          safe = json.loads((root / 'safe-report.json').read_text())
          unsafe = json.loads((root / 'unsafe-report.json').read_text())
          assert safe['status'] == unsafe['status'] == 'ok', 'Scan did not complete'
          assert safe['totals']['files'] == unsafe['totals']['files'] == 1, 'Scan did not analyze its input'
          assert safe['totals']['critical'] == safe['totals']['warning'] == 0, 'Safe control was flagged'
          assert unsafe['totals']['critical'] > 0, 'Unsafe control had no critical findings'
          assert not (root / 'scan-network-attempts.log').exists(), 'Scan attempted a dependency download'
          print('Public UBS safe/unsafe scans passed without curl/wget downloads')
          PY
      - name: Retain public smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-public-smoke-logs
          # Only this fresh home's diagnostic directory, never agent config/secrets.
          path: ${{ runner.temp }}/acfs-cloud-smoke/.acfs/cloud/
          include-hidden-files: true
          if-no-files-found: warn
